name: Publish university notes
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether native Android code changed
        id: native
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ] || [ "$BEFORE_SHA" = 0000000000000000000000000000000000000000 ]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" | grep -Eq '^(android/(app/|build.gradle|settings.gradle|gradle.properties)|scripts/package-android-release.py)'; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Build site from sources
        run: |
          npm ci
          node scripts/build-notes.mjs
      - name: Validate current static build
        run: |
          python3 scripts/validate-site.py
          node scripts/check-practice-variants.mjs
          node scripts/check-schedule.mjs
          node --test service/schedule/worker.test.mjs
      - name: Export for project hosting
        run: python3 scripts/export-pages.py
      - name: Prepare Android offline updates
        run: |
          python3 -m pip install CairoSVG==2.7.1
          python3 scripts/prepare-android.py
          python3 scripts/publish-android-feed.py
      - name: Assemble textbooks for the website only
        run: python3 scripts/prepare-textbooks.py
      - name: Test mobile interface
        run: |
          node tests/textbooks.test.cjs
          node tests/tools.test.cjs
          node android/tests/mobile.test.cjs
          node android/tests/admin.test.cjs
          node android/tests/controls.test.cjs
      - uses: actions/setup-java@v4
        if: steps.native.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: steps.native.outputs.build == 'true'
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        if: steps.native.outputs.build == 'true'
        with:
          gradle-version: '8.9'
      - name: Install Android build tools
        if: steps.native.outputs.build == 'true'
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and test Android
        if: steps.native.outputs.build == 'true'
        run: gradle -p android assembleRelease testDebugUnitTest lintRelease --console=plain
      - name: Prepare signed release when the original key is available
        if: steps.native.outputs.build == 'true'
        id: apk
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/package-android-release.py
      - uses: actions/upload-artifact@v4
        if: steps.native.outputs.build == 'true'
        with:
          name: android-${{ steps.apk.outputs.version }}
          path: android/release-output/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-checks
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-release.*
          if-no-files-found: ignore
      - name: Publish signed APK release
        if: steps.apk.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.apk.outputs.version }}
        run: |
          tag="android-v${APP_VERSION}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" android/release-output/app.apk android/release-output/app-release.json --target "$GITHUB_SHA" --title "Android ${APP_VERSION}" --notes "Учебные инструменты, личные заметки, блок-схемы, поиск дисциплин и новая навигация."
          fi
      - name: Preserve the published APK feed during material-only updates
        if: steps.native.outputs.build != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view >/dev/null 2>&1; then
            gh release download --pattern 'app.apk' --pattern 'app-release.json' --dir pages-output/android
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-output
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
