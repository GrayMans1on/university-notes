name: Publish university notes
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Build site from sources
        run: |
          npm ci
          node scripts/build-notes.mjs
      - name: Validate current static build
        run: python3 scripts/validate-site.py
      - name: Export for project hosting
        run: python3 scripts/export-pages.py
      - name: Prepare Android offline updates
        run: |
          python3 -m pip install CairoSVG==2.7.1
          python3 scripts/prepare-android.py
          python3 scripts/publish-android-feed.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-output
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
