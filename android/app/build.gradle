plugins {
    id 'com.android.application'
}
android {
    namespace 'ru.graymansion.study'
    compileSdk 35
    defaultConfig {
        applicationId 'ru.graymansion.study'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '1.3.0'
    }
    sourceSets {
        main.assets.srcDirs = ['../generated/assets']
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
