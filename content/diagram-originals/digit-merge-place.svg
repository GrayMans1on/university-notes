<text x="725" y="314.0" font-family="DejaVu Sans" font-size="18" text-anchor="middle" fill="#36465e">Нет</text>
<text x="265" y="701.0" font-family="DejaVu Sans" font-size="18" text-anchor="middle" fill="#36465e">Да</text>
<text x="780" y="701.0" font-family="DejaVu Sans" font-size="18" text-anchor="middle" fill="#36465e">Нет</text>
<path d="M250 865V950H750V865M500 950H40V330H330" fill="none" stroke="#36465e" stroke-width="2"/>
<path d="M40 330H330" fill="none" stroke="#36465e" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
