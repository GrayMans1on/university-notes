<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" role="img"><title>Матрица линейного оператора и координатная формула</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#254cce"/></marker></defs><text x="390" y="35" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#36465e">Координаты образов записываются столбцами</text><rect x="30" y="65" width="200" height="90" rx="12" fill="none" stroke="#254cce" stroke-width="2"/><text x="130" y="100" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#36465e">φ(e1)</text><text x="130" y="132" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#36465e">столбец 1 матрицы</text><rect x="290" y="65" width="200" height="90" rx="12" fill="none" stroke="#254cce" stroke-width="2"/><text x="390" y="100" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#36465e">φ(e2)</text><text x="390" y="132" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#36465e">столбец 2 матрицы</text><rect x="550" y="65" width="200" height="90" rx="12" fill="none" stroke="#254cce" stroke-width="2"/><text x="650" y="100" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#36465e">φ(e3)</text><text x="650" y="132" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#36465e">столбец 3 матрицы</text><text x="390" y="205" text-anchor="middle" font-family="DejaVu Sans" font-size="22" fill="#36465e">X = (x₁, …, xₙ)ᵀ     →     Y = Aφ X</text><text x="390" y="245" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#36465e">n входных координат → m выходных координат</text></svg>