<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 405" role="img" aria-labelledby="title"><title id="title">Схема двух вложенных циклов от 1 до 9</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#254cce"/></marker></defs><rect x="55" y="20" width="510" height="310" rx="8" stroke="#42536c" stroke-width="2" fill="none"/><text x="310" y="58" font-family="DejaVu Sans" font-size="20" fill="#36465e" text-anchor="middle">Для каждого i = 1, …, 9</text><rect x="115" y="90" width="390" height="170" rx="8" stroke="#168276" stroke-width="2" fill="none"/><text x="310" y="125" font-family="DejaVu Sans" font-size="20" fill="#36465e" text-anchor="middle">Для каждого j = 1, …, 9</text><rect x="205" y="160" width="210" height="60" rx="8" stroke="#254cce" stroke-width="2" fill="none"/><text x="310.0" y="196.0" font-family="DejaVu Sans" font-size="18" fill="#36465e" text-anchor="middle">Действие с (i, j)</text><text x="310" y="300" font-family="DejaVu Sans" font-size="18" fill="#36465e" text-anchor="middle">9 полных запусков внутреннего цикла</text><text x="310" y="370" font-family="DejaVu Sans" font-size="21" fill="#36465e" text-anchor="middle">Всего 9 × 9 = 81 выполнение действия</text></svg>