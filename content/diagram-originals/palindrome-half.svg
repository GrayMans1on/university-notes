<text x="450" y="629.0" font-family="DejaVu Sans" font-size="21" text-anchor="middle" fill="#36465e">k = n % 10</text>
<text x="450" y="657.0" font-family="DejaVu Sans" font-size="21" text-anchor="middle" fill="#36465e">m = 10*m + k</text>
<text x="450" y="685.0" font-family="DejaVu Sans" font-size="21" text-anchor="middle" fill="#36465e">n = n // 10</text>
