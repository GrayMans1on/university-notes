<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1100" role="img"><title>Палиндром: разворот половины цифр</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#36465e"/></marker></defs>
