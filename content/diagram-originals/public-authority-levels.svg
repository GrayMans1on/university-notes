<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 475" role="img" aria-label="Три территориальных уровня публичной власти и три ветви власти: разные основания классификации"><title>Три территориальных уровня публичной власти и три ветви власти: разные основания классификации</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#254cce"/></marker></defs><text x="400" y="30" text-anchor="middle" font-family="DejaVu Sans" font-size="22" fill="#36465e">Публичная власть: два основания устройства</text><text x="190" y="75" text-anchor="middle" font-family="DejaVu Sans" font-size="18" fill="#36465e">Вертикаль: уровни территории</text><text x="600" y="75" text-anchor="middle" font-family="DejaVu Sans" font-size="18" fill="#36465e">Горизонталь: разделение властей</text><rect x="55" y="105" width="270" height="54" rx="10" fill="#dce6ff" stroke="#254cce"/><text x="190.0" y="138" text-anchor="middle" font-family="DejaVu Sans" font-size="18" fill="#36465e">Федеральный</text><path d="M190,160 L190,192" fill="none" stroke="#254cce" stroke-width="2" marker-end="url(#arrow)"/><rect x="55" y="200" width="270" height="54" rx="10" fill="#dce6ff" stroke="#254cce"/><text x="190.0" y="233" text-anchor="middle" font-family="DejaVu Sans" font-size="18" fill="#36465e">Субъекты РФ</text><path d="M190,255 L190,287" fill="none" stroke="#254cce" stroke-width="2" marker-end="url(#arrow)"/><rect x="55" y="295" width="270" height="54" rx="10" fill="#dce6ff" stroke="#254cce"/><text x="190.0" y="328" text-anchor="middle" font-family="DejaVu Sans" font-size="18" fill="#36465e">Муниципальный</text><rect x="455" y="105" width="290" height="54" rx="10" fill="#dce6ff" stroke="#254cce"/><text x="600.0" y="138" text-anchor="middle" font-family="DejaVu Sans" font-size="18" fill="#36465e">Законодательная</text><rect x="455" y="200" width="290" height="54" rx="10" fill="#dce6ff" stroke="#254cce"/><text x="600.0" y="233" text-anchor="middle" font-family="DejaVu Sans" font-size="18" fill="#36465e">Исполнительная</text><rect x="455" y="295" width="290" height="54" rx="10" fill="#dce6ff" stroke="#254cce"/><text x="600.0" y="328" text-anchor="middle" font-family="DejaVu Sans" font-size="18" fill="#36465e">Судебная</text><text x="400" y="420" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#36465e">Уровень территории и вид полномочий — разные признаки.</text><text x="400" y="449" text-anchor="middle" font-family="DejaVu Sans" font-size="16" fill="#36465e">Единство системы предполагает взаимодействие и разграничение полномочий.</text></svg>